<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="flow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="flow-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="title-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.95" />
    </filter>

    <filter id="text-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.95" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes flowForward {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes flowBackward {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 400; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPillAlt {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes beaconBlink {
      0%, 100% { r: 3px; opacity: 0.4; }
      50% { r: 7px; opacity: 1; }
    }

    .pulse-layer {
      transform-origin: 600px 190px;
      animation: pulseGlow 7s ease-in-out infinite;
    }
    .flow-line-1 {
      stroke-dasharray: 24, 16;
      animation: flowForward 9s linear infinite;
    }
    .flow-line-2 {
      stroke-dasharray: 20, 14;
      animation: flowBackward 7s linear infinite;
    }
    .flow-line-3 {
      stroke-dasharray: 28, 20;
      animation: flowForward 11s linear infinite;
    }
    .pill-1 { animation: floatPill 6s ease-in-out infinite; }
    .pill-2 { animation: floatPillAlt 6.5s ease-in-out infinite 0.5s; }
    .pill-3 { animation: floatPill 7s ease-in-out infinite 1s; }
    .pill-4 { animation: floatPillAlt 6s ease-in-out infinite 1.5s; }
    .pill-5 { animation: floatPill 8s ease-in-out infinite 2s; }
    .beacon { animation: beaconBlink 2.5s ease-in-out infinite; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.02em;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.12em;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Animated Ambient Nebula/Glow Layer (In Background) -->
  <g class="pulse-layer" filter="url(#glow)">
    <circle cx="260" cy="190" r="160" fill="#0284c7" opacity="0.16" />
    <circle cx="600" cy="200" r="220" fill="#4f46e5" opacity="0.2" />
    <circle cx="940" cy="180" r="170" fill="#9333ea" opacity="0.15" />
  </g>

  <!-- Dynamic Network Topology Flow Lines (Background Layer) -->
  <g stroke-linecap="round" fill="none">
    <!-- Ingress Highway 1 -->
    <path d="M -50 90 C 250 90, 350 170, 600 170 C 850 170, 950 110, 1250 110" stroke="url(#flow-cyan)" stroke-width="2.5" class="flow-line-1" />
    <!-- Ingress Highway 2 -->
    <path d="M -50 280 C 200 280, 400 210, 600 210 C 800 210, 1000 290, 1250 290" stroke="url(#flow-purple)" stroke-width="2.5" class="flow-line-2" />
    <!-- Service Mesh Transit Highway 3 -->
    <path d="M 100 -20 C 300 120, 500 140, 600 190 C 700 240, 900 260, 1100 400" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.75" class="flow-line-3" />
  </g>

  <!-- Dynamic Router & Ingress Nodes (Background Layer) -->
  <g filter="url(#soft-glow)">
    <circle cx="250" cy="130" r="6" fill="#38bdf8" />
    <circle cx="250" cy="130" r="3" fill="#ffffff" class="beacon" />

    <circle cx="950" cy="140" r="6" fill="#818cf8" />
    <circle cx="950" cy="140" r="3" fill="#ffffff" class="beacon" />

    <circle cx="420" cy="260" r="6" fill="#c084fc" />
    <circle cx="420" cy="260" r="3" fill="#ffffff" class="beacon" />

    <circle cx="820" cy="260" r="6" fill="#38bdf8" />
    <circle cx="820" cy="260" r="3" fill="#ffffff" class="beacon" />
  </g>

  <!-- Floating Tech Ecosystem Pills (Midground, placed carefully around the perimeter) -->
  <!-- Top Left: Envoy -->
  <g class="pill-1" transform="translate(60, 46)">
    <rect width="118" height="34" rx="17" fill="url(#pill-grad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="17" r="5" fill="#e11d48" />
    <text x="35" y="22" fill="#e2e8f0" class="tag-text">Envoy</text>
  </g>

  <!-- Bottom Left: Traefik -->
  <g class="pill-2" transform="translate(80, 298)">
    <rect width="128" height="34" rx="17" fill="url(#pill-grad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="17" r="5" fill="#24c8db" />
    <text x="35" y="22" fill="#e2e8f0" class="tag-text">Traefik</text>
  </g>

  <!-- Top Right: Kong -->
  <g class="pill-3" transform="translate(1010, 46)">
    <rect width="120" height="34" rx="17" fill="url(#pill-grad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="17" r="5" fill="#003459" />
    <text x="35" y="22" fill="#e2e8f0" class="tag-text">Kong</text>
  </g>

  <!-- Bottom Right: NGINX -->
  <g class="pill-4" transform="translate(990, 298)">
    <rect width="124" height="34" rx="17" fill="url(#pill-grad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="17" r="5" fill="#009639" />
    <text x="35" y="22" fill="#e2e8f0" class="tag-text">NGINX</text>
  </g>

  <!-- Bottom Center Pill: Caddy & HAProxy -->
  <g class="pill-5" transform="translate(525, 318)">
    <rect width="150" height="32" rx="16" fill="url(#pill-grad)" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.3" />
    <text x="75" y="21" fill="#94a3b8" class="tag-text" text-anchor="middle">Caddy · HAProxy</text>
  </g>

  <!-- ============================================================== -->
  <!-- FOREGROUND LAYER: Typography & Brand Identity (ALWAYS CLEAR & UNHIDDEN) -->
  <!-- ============================================================== -->
  <g id="foreground-content">
    <!-- Top Category Kicker Badge -->
    <g transform="translate(600, 78)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="-116" cy="0" r="4" fill="#38bdf8" />
      <text x="-104" y="4" fill="#38bdf8" class="badge-text">CLOUD-NATIVE TRAFFIC ROUTING</text>
    </g>

    <!-- Main Title with dedicated SVG drop-shadow filter -->
    <text x="600" y="162" text-anchor="middle" class="title-text" font-size="44" fill="url(#title-grad)" filter="url(#title-shadow)">Awesome API Gateway &amp; Reverse Proxy</text>

    <!-- Subtitle with dedicated SVG drop-shadow filter -->
    <text x="600" y="212" text-anchor="middle" class="subtitle-text" font-size="18" fill="#e2e8f0" filter="url(#text-shadow)">Production Ingress · Dynamic Service Discovery · Edge Load Balancing · Cloud APIs</text>

    <!-- Feature Pillars -->
    <text x="600" y="254" text-anchor="middle" class="subtitle-text" font-size="14" fill="#94a3b8" filter="url(#text-shadow)">Low-Latency L4/L7 Routing • Automated Zero-Trust TLS • Multi-Cloud &amp; Kubernetes</text>
  </g>
</svg>
